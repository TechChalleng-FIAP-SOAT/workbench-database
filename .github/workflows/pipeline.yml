name: "Terraform RDS (one instance per service) Deployment"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:

  preflight:
    name: "Preflight (PR → develop)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Terraform fmt & init (no backend)
        run: |
          terraform fmt -recursive
          terraform init -backend=false

      - name: Terraform validate (placeholders)
        run: |
          cat > ci-placeholder.auto.tfvars <<'EOF'
          vpc_id     = "placeholder"
          subnet_ids = ["subnet-1","subnet-2"]
          services = {
            os_service = { db_name = "os_service", db_username = "os_service" }
            billing    = { db_name = "billing",    db_username = "billing" }
            customer   = { db_name = "customer",   db_username = "customer" }
          }
          service_passwords = { os_service = "placeholder", billing = "placeholder", customer = "placeholder" }
          EOF
          terraform validate

  deploy:
    name: "Terraform Deploy (develop/main)"
    needs: []
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      # Credenciais/ambiente do runner. As VARIÁVEIS do Terraform NÃO vão por TF_VAR_*
      # — elas são escritas num arquivo deploy.auto.tfvars.json (passo "Build tfvars"),
      # lido de forma idêntica por plan e apply. Isso evita o erro
      # "Can't change variable when applying a saved plan".
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      VPC_ID: ${{ github.ref_name == 'main' && secrets.VPC_ID_MAIN || secrets.VPC_ID_DEVELOP }}
      SUBNET_IDS: ${{ github.ref_name == 'main' && secrets.SUBNET_IDS_MAIN || secrets.SUBNET_IDS_DEVELOP }} # '["subnet-1","subnet-2"]'
      K8S_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      ENVIRONMENT: ${{ github.ref_name }}
      AWS_ACCOUNT_ID: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      DB_USERNAME_OS: ${{ secrets.DB_USERNAME_OS || 'os_service' }}
      DB_USERNAME_BILLING: ${{ secrets.DB_USERNAME_BILLING || 'billing' }}
      DB_USERNAME_CUSTOMER: ${{ secrets.DB_USERNAME_CUSTOMER || 'customer' }}
      DB_PASSWORD_OS: ${{ secrets.DB_PASSWORD_OS }}
      DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
      DB_PASSWORD_CUSTOMER: ${{ secrets.DB_PASSWORD_CUSTOMER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          # Sem wrapper: evita que a action intercepte/re-execute o terraform.
          terraform_wrapper: false

      - name: Build tfvars (rede + serviços + senhas)
        shell: bash
        run: |
          for v in DB_PASSWORD_OS DB_PASSWORD_BILLING DB_PASSWORD_CUSTOMER; do
            if [ -z "${!v}" ]; then
              echo "::error::Segredo $v ausente."; exit 1
            fi
          done
          : "${SUBNET_IDS:?SUBNET_IDS ausente}"

          # TODAS as variáveis do Terraform num único arquivo auto-carregado, lido
          # igualmente por plan e apply. Nada vai por TF_VAR_* (origem do erro).
          cat > deploy.auto.tfvars.json <<JSON
          {
            "environment": "${ENVIRONMENT}",
            "name_prefix": "workshop",
            "region": "${AWS_REGION}",
            "aws_account_id": "${AWS_ACCOUNT_ID}",
            "k8s_remote_state_bucket": "${K8S_STATE_BUCKET}",
            "vpc_id": "${VPC_ID}",
            "subnet_ids": ${SUBNET_IDS},
            "services": {
              "os_service": { "db_name": "os_service", "db_username": "${DB_USERNAME_OS}" },
              "billing":    { "db_name": "billing",    "db_username": "${DB_USERNAME_BILLING}" },
              "customer":   { "db_name": "customer",   "db_username": "${DB_USERNAME_CUSTOMER}" }
            },
            "service_passwords": {
              "os_service": "${DB_PASSWORD_OS}",
              "billing":    "${DB_PASSWORD_BILLING}",
              "customer":   "${DB_PASSWORD_CUSTOMER}"
            }
          }
          JSON
          echo "deploy.auto.tfvars.json gerado (valores omitidos)."

      - name: Terraform Init
        shell: bash
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "A variável TF_STATE_BUCKET não está configurada."
            exit 1
          fi

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=workbench-database/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Import existing AWS resources when state is empty
        shell: bash
        run: |
          import_if_missing() {
            local address="$1"
            local resource_id="$2"
            if ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import -input=false "$address" "$resource_id" || true
            fi
          }

          # Importa, por serviço, a instância/SG/subnet group já existentes (se houver).
          for svc in os_service billing customer; do
            id_svc="${svc//_/-}" # identifier usa hífen
            identifier="workshop-${id_svc}-${{ github.ref_name }}"

            instance_exists=$(aws rds describe-db-instances \
              --db-instance-identifier "$identifier" \
              --query 'DBInstances[0].DBInstanceIdentifier' --output text 2>/dev/null || true)
            if [ "$instance_exists" != "None" ] && [ -n "$instance_exists" ]; then
              import_if_missing "module.service_db[\"$svc\"].aws_db_instance.this" "$identifier"
            fi

            sg_id=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=${identifier}-security-group" \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)
            if [ "$sg_id" != "None" ] && [ -n "$sg_id" ]; then
              import_if_missing "module.service_db[\"$svc\"].aws_security_group.this" "$sg_id"
            fi

            subnet_group="${identifier}-subnet-group"
            sg_exists=$(aws rds describe-db-subnet-groups \
              --db-subnet-group-name "$subnet_group" \
              --query 'DBSubnetGroups[0].DBSubnetGroupName' --output text 2>/dev/null || true)
            if [ "$sg_exists" != "None" ] && [ -n "$sg_exists" ]; then
              import_if_missing "module.service_db[\"$svc\"].aws_db_subnet_group.this" "$subnet_group"
            fi
          done

      # plan e apply leem o mesmo deploy.auto.tfvars.json (sem TF_VAR_*, sem plano
      # salvo), então não há "Can't change variable when applying a saved plan".
      - name: Terraform Plan (log)
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        shell: bash
        run: terraform apply -input=false -auto-approve
